<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#092a39">
  <meta name="description" content="Meu Financeiro — registre movimentações com praticidade. Versão local e offline com rascunhos.">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; connect-src 'self'">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" sizes="192x192" href="./icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <link rel="stylesheet" href="./styles.css">
  <title>Meu Financeiro · Seu dinheiro com clareza</title>
</head>
<body>
<div id="app" class="app">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brandmark"><img src="./icons/logo-mark.svg" alt="" width="37" height="37"></div>
        <div class="brandtext">
          <div class="brandname">meu<span>financeiro</span></div>
          <div class="brandtag">Seu dinheiro, com clareza.</div>
        </div>
      </div>
      <div class="topactions">
        <span id="net-status" class="connection" title="As informações ficam apenas no seu aparelho"><span class="dot"></span> Local</span>
        <button id="btn-settings" class="iconbtn" type="button" aria-label="Abrir ajustes" title="Ajustes">
          <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8.2a3.8 3.8 0 1 0 0 7.6 3.8 3.8 0 0 0 0-7.6Z"/><path d="M19.4 13.6a7.8 7.8 0 0 0 0-3.2l2-1.5-2-3.4-2.4.9a8 8 0 0 0-2.7-1.6L14 2.3h-4l-.4 2.5A8 8 0 0 0 7 6.4l-2.4-.9-2 3.4 2 1.5a7.8 7.8 0 0 0 0 3.2l-2 1.5 2 3.4 2.4-.9a8 8 0 0 0 2.7 1.6l.4 2.5h4l.4-2.5a8 8 0 0 0 2.7-1.6l2.4.9 2-3.4-2-1.5Z" transform="translate(0 -.02) scale(.99)"/></svg>
        </button>
      </div>
    </div>
  </header>
  <main id="main" class="main"></main>
  <nav class="bottomnav" aria-label="Navegação principal">
    <button type="button" class="navitem selected" data-route="inicio"><span class="navicon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></svg></span><span>Início</span></button>
    <button type="button" class="navitem" data-route="registrar"><span class="navicon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span><span>Registrar</span></button>
    <button type="button" class="navitem" data-route="consultar"><span class="navicon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg></span><span>Consultar</span></button>
    <button type="button" class="navitem" data-route="rascunhos"><span class="navicon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg></span><span>Rascunhos</span></button>
  </nav>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
